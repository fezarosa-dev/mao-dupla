<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>InstaNF</title>
<link rel="icon" href="icons/icon32.png">
<style>
  :root {
    color-scheme: light dark;
    --ground: #e7ebe9; --surface: #f6f8f7; --ink: #141a19; --muted: #5b6967; --line: #cbd3d1; --line-strong: #9fb0ad;
    --accent: #0b6e6a; --on-accent: #fff; --danger: #c3361d; --sel: #dcebe8;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --out: cubic-bezier(.23, 1, .32, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root { --ground: #0d1312; --surface: #151c1b; --ink: #e6ecea; --muted: #8b9b98; --line: #26322f; --line-strong: #3d4f4b;
      --accent: #3fb8ae; --on-accent: #07201e; --danger: #f0674f; --sel: #1a2a28; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--ground); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button, input, select { touch-action: manipulation; }

  .layout { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
  aside { position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 22px 14px; border-right: 1px solid var(--line); background: var(--surface); }
  .brand { padding: 0 8px 16px; }
  .brand h1 img { vertical-align: -7px; margin-right: 9px; border-radius: 8px; }
  .brand h1 { margin: 0; font: 700 20px/1.1 var(--mono); letter-spacing: -.04em; }
  .brand p { margin: 4px 0 0; color: var(--muted); font-size: 12.5px; }
  #load { width: 100%; margin: 0 0 8px; }
  .io { display: flex; gap: 6px; margin-bottom: 8px; }
  .io button { flex: 1; }
  #status { color: var(--muted); font-size: 12.5px; padding: 0 8px 14px; min-height: 20px; overflow-wrap: anywhere; }
  .grp { margin: 14px 8px 4px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .tab { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; text-align: left;
    border: 0; background: transparent; padding: 7px 8px; border-radius: 8px; }
  .tab b { font: 500 12px var(--mono); font-variant-numeric: tabular-nums; color: var(--muted); }
  .tab[aria-current="page"] { background: var(--ink); color: var(--surface); }
  .tab[aria-current="page"] b { color: inherit; opacity: .75; }

  main { padding: 24px 28px 80px; min-width: 0; }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    aside { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
    main { padding: 18px 14px 64px; }
  }

  button { font: inherit; cursor: pointer; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
    padding: 7px 13px; border-radius: 8px; transition: transform 120ms var(--out), background-color 150ms, border-color 150ms, color 150ms; }
  @media (hover: hover) and (pointer: fine) { button:hover:not(:disabled):not([aria-current="page"]) { border-color: var(--ink); } .tab:hover:not([aria-current="page"]) { background: var(--sel); } }
  button:active:not(:disabled) { transform: scale(.97); }
  button:disabled { cursor: not-allowed; color: var(--muted); background: transparent; border-color: var(--line); opacity: .6; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  button.danger { background: var(--danger); border-color: var(--danger); color: #fff; font-weight: 600; }
  button.ghost-danger { color: var(--danger); border-color: var(--danger); background: transparent; }
  button.small { padding: 4px 10px; font-size: 12.5px; }
  button.primary:disabled, button.danger:disabled, button.ghost-danger:disabled { background: transparent; color: var(--muted); border-color: var(--line); }
  button.tab { border: 0; }
  button.tab:disabled { opacity: 1; }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  #lprog { display: none; margin-bottom: 16px; animation: rise 220ms var(--out) both; }
  progress { appearance: none; width: 100%; height: 6px; border: 0; border-radius: 99px; overflow: hidden; background: var(--line); display: block; margin-top: 8px; }
  progress::-webkit-progress-bar { background: var(--line); }
  progress::-webkit-progress-value { background: var(--accent); transition: width 300ms var(--out); }
  progress:not([value])::after { content: ""; display: block; height: 100%; width: 35%; background: var(--accent); animation: slide 1.1s infinite ease-in-out; }

  .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .bar input[type=search] { flex: 1; min-width: 200px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line-strong);
    background: var(--surface); color: var(--ink); font: inherit; }
  .bar label { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 6px; }
  select { font: inherit; padding: 7px 8px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); }
  .bulk { animation: pop 180ms var(--out) both; }

  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  .grid.anim .user { animation: rise 220ms var(--out) both; animation-delay: calc(var(--i, 0) * 20ms); }
  .user { position: relative; display: flex; align-items: flex-start; gap: 12px; padding: 14px; background: var(--surface);
    border: 1px solid var(--line); border-radius: 12px; min-width: 0; transition: border-color 150ms, background-color 150ms; }
  @media (hover: hover) and (pointer: fine) { .user:hover { border-color: var(--line-strong); } }
  .user.sel { background: var(--sel); border-color: var(--accent); }
  .user img, .ph { width: 52px; height: 52px; border-radius: 14px; object-fit: cover; background: var(--line); flex: none; }
  .ph { display: grid; place-items: center; font: 600 18px var(--mono); color: var(--muted); text-transform: uppercase; }
  .user input[type=checkbox] { width: 18px; height: 18px; flex: none; accent-color: var(--accent); margin: 2px 0 0; cursor: pointer; }
  .info { min-width: 0; flex: 1; }
  .info a { color: var(--ink); font: 600 14px var(--mono); letter-spacing: -.02em; text-decoration: none; display: block; overflow-wrap: anywhere; }
  .info a:hover { text-decoration: underline; text-underline-offset: 3px; }
  .selo { display: inline-block; width: 15px; height: 15px; margin-left: 5px; vertical-align: -2px; color: #0095f6; }
  .selo svg { display: block; width: 100%; height: 100%; }
  .info small { color: var(--muted); display: block; overflow-wrap: anywhere; }
  .rel { margin-top: 6px; display: flex; flex-direction: column; font-size: 12px; color: var(--muted); }
  .rel span::before { display: inline-block; width: 1.4em; font-family: var(--mono); }
  .rel span:nth-child(1)::before { content: "→"; }
  .rel span:nth-child(2)::before { content: "←"; }
  .rel span.on { color: var(--ink); font-weight: 600; }
  .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }

  .pager { display: flex; justify-content: center; align-items: center; gap: 14px; margin-top: 22px; }
  #pageinfo { font-variant-numeric: tabular-nums; color: var(--muted); }
  .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 56px 0; }

  #fila { display: none; animation: rise 220ms var(--out) both; }
  #fila h2 { margin: 0 0 6px; font-size: 17px; }
  #fila .ctl { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
  .item { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); }
  .item .info { flex: 1; }
  .item img, .item .ph { width: 40px; height: 40px; border-radius: 11px; font-size: 15px; }
  .badge { padding: 2px 10px; border-radius: 6px; font-size: 12px; background: var(--line); color: var(--muted); white-space: nowrap; }
  .badge.andamento { background: var(--accent); color: var(--on-accent); animation: pulse 1.2s infinite; }
  .badge.feito { background: var(--ink); color: var(--surface); }
  .badge.erro { background: var(--danger); color: #fff; }

  dialog { border: 1px solid var(--line-strong); border-radius: 14px; padding: 22px; max-width: 440px; background: var(--surface); color: var(--ink); }
  dialog[open] { animation: pop 180ms var(--out) both; }
  dialog::backdrop { background: rgba(8, 12, 11, .55); animation: fade 180ms both; }
  dialog h3 { margin: 0 0 8px; font-size: 17px; }
  dialog p { margin: 0 0 18px; white-space: pre-line; color: var(--muted); }
  dialog .ctl { display: flex; justify-content: flex-end; gap: 8px; }

  #toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 10; }
  .toast { background: var(--ink); color: var(--surface); border-radius: 10px; padding: 10px 14px; max-width: 360px; animation: slidein 220ms var(--out) both; }
  .toast.erro { background: var(--danger); color: #fff; }
  .toast.sai { animation: slideout 200ms ease-out both; }

  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  @keyframes pop { from { opacity: 0; transform: scale(.96); } }
  @keyframes fade { from { opacity: 0; } }
  @keyframes slidein { from { opacity: 0; transform: translateY(8px); } }
  @keyframes slideout { to { opacity: 0; transform: translateY(8px); } }
  @keyframes slide { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }
  @keyframes pulse { 50% { opacity: .6; } }
  @media (prefers-reduced-motion: reduce) { *, ::before, ::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
</style>
<div class="layout">
  <aside>
    <div class="brand">
      <h1><img src="icons/logo.svg" alt="" width="28" height="28">InstaNF</h1>
      <p>Quem segue quem, no seu perfil.</p>
    </div>
    <button id="load" class="primary">Carregar do Instagram</button>
    <div class="io">
      <button id="exp" class="small" title="Salva todas as abas num arquivo .zip">Exportar zip</button>
      <button id="imp" class="small" title="Restaura os dados de um .zip exportado">Importar zip</button>
      <input id="file" type="file" accept=".zip,application/zip" hidden>
    </div>
    <div id="status" role="status">Deixe uma aba do instagram.com logada aberta e clique em carregar.</div>
    <nav id="tabs" aria-label="Listas"></nav>
  </aside>

  <main>
    <div id="lprog" class="panel">
      <div id="lprogtxt" role="status"></div>
      <progress id="lprogbar"></progress>
    </div>

    <section id="fila" class="panel">
      <h2 id="ftitle"></h2>
      <div id="fstatus" role="status"></div>
      <progress id="fbar" value="0" max="1"></progress>
      <div class="ctl">
        <button id="fstart" class="danger"></button>
        <button id="fstop">Parar</button>
        <button id="fclear">Limpar concluídos</button>
        <button id="fempty">Esvaziar fila</button>
      </div>
      <div id="flist"></div>
    </section>

    <section id="lista">
      <div class="bar" id="barra">
        <input id="q" type="search" aria-label="Buscar por usuário ou nome" placeholder="Buscar por usuário ou nome…" autocomplete="off" spellcheck="false">
        <label>Por página
          <select id="pp"><option>12</option><option>24</option><option>48</option><option>96</option></select>
        </label>
        <button id="selpage">Selecionar página</button>
        <button id="selnone">Limpar seleção</button>
        <button id="bulkU" class="danger bulk" hidden></button>
        <button id="bulkF" class="primary bulk" hidden></button>
      </div>
      <div class="grid" id="grid"></div>
      <div class="pager" id="pager">
        <button id="prev">‹ Anterior</button>
        <span id="pageinfo"></span>
        <button id="next">Próxima ›</button>
      </div>
    </section>
  </main>
</div>

<div id="toasts" role="status" aria-live="polite"></div>
<dialog id="dlg">
  <form method="dialog">
    <h3 id="dtit"></h3>
    <p id="dmsg"></p>
    <div class="ctl">
      <button value="cancel">Cancelar</button>
      <button value="ok" id="dok" class="danger"></button>
    </div>
  </form>
</dialog>
<script src="app.js"></script>
