name: Release

# Gera o .zip instalável da extensão.
#  - Push de tag "vX.Y.Z"  -> cria a Release no GitHub com o zip anexado.
#  - Execução manual       -> só gera o zip como artefato do workflow (para testar).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ler versão do manifest
        id: v
        run: echo "versao=$(jq -r .version manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Conferir se a tag bate com o manifest
        if: github.ref_type == 'tag'
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "${{ steps.v.outputs.versao }}" ]; then
            echo "::error::A tag ${GITHUB_REF_NAME} não bate com a versão do manifest.json (${{ steps.v.outputs.versao }})."
            exit 1
          fi

      - name: Empacotar a extensão
        run: |
          mkdir -p build/mao-dupla dist
          cp -r manifest.json app.html app.js background.js icons build/mao-dupla/
          (cd build && zip -r "../dist/mao-dupla-v${{ steps.v.outputs.versao }}.zip" mao-dupla)

      - name: Criar a Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/mao-dupla-v${{ steps.v.outputs.versao }}.zip" \
            --title "Mão Dupla $GITHUB_REF_NAME" --generate-notes

      - name: Guardar o zip como artefato (execução manual)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: mao-dupla
          path: dist/*.zip
